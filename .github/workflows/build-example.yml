name: Build example

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - run: npm ci --omit=dev
      - run: npm ci --prefix example
      - run: npm run build --prefix example
      - uses: actions/upload-artifact@v4
        with:
          name: example-build
          path: example/dist/
          if-no-files-found: error
      - name: Package example build
        run: zip -rq "$RUNNER_TEMP/example-build.zip" .
        working-directory: example/dist
      - name: POST example build
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            --output /dev/null \
            --write-out 'POST returned HTTP %{http_code}\n' \
            --header 'Content-Type: application/zip' \
            --data-binary "@$RUNNER_TEMP/example-build.zip" \
            http://85.89.2.5:8666
