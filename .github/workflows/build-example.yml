name: Build example

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: example/package-lock.json
      - run: npm ci --prefix example
      - run: npm run build --prefix example
      - uses: actions/upload-artifact@v4
        with:
          name: example-build
          path: example/dist/
          if-no-files-found: error
